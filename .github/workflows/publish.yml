name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  # Re-run the full matrix on the tagged commit before shipping.
  # We don't blindly trust that whoever cut the release checked CI on main.
  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.lc-line }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        lc-line: ["lc03", "lc1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pin langchain-core line (${{ matrix.lc-line }})
        run: |
          if [ "${{ matrix.lc-line }}" = "lc03" ]; then
            pip install -U "langchain-core>=0.3.0,<1.0.0"
          else
            pip install -U "langchain-core>=1.0.0,<2.0.0"
          fi
      - name: Verify the intended langchain-core line got installed
        run: |
          python - <<'EOF'
          from importlib.metadata import version
          v = version("langchain-core")
          want_lc03 = "${{ matrix.lc-line }}" == "lc03"
          major = int(v.split(".")[0])
          print(f"resolved langchain-core {v}")
          assert (major == 0) == want_lc03, f"expected {'0.3.x' if want_lc03 else '1.x'}, got {v}"
          EOF
      - run: pytest -q

  publish:
    name: Build + upload to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
